[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clip-pipeline"
version = "0.0.1"
description = "Phase 0 of the AI clipping pipeline: transcribe, rank, and render vertical clips."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
clip = "clip.cli:main"

[tool.setuptools.packages.find]
include = ["clip*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
